
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — PrepComeBack</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f8fafc;
            color: #0f172a;

            transition:
                background 0.3s ease,
                color 0.3s ease;

            padding: 25px;
        }


        /* =========================
           BACKGROUND
        ========================= */

        .page {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at top right,
                    #dbeafe,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    #e0e7ff,
                    transparent 30%
                );

            transition: background 0.3s ease;
        }


        /* =========================
           CARD
        ========================= */

        .auth-card {

            width: min(440px, 100%);

            background: rgba(255, 255, 255, 0.96);

            border: 1px solid #e2e8f0;

            border-radius: 24px;

            padding: 38px;

            box-shadow:
                0 25px 70px rgba(15, 23, 42, 0.12);

            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;

            position: relative;
        }


        /* =========================
           TOP BAR
        ========================= */

        .top-bar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 28px;
        }


        .back-link {

            color: #64748b;

            font-size: 14px;

            text-decoration: none;

            font-weight: 600;

            transition: color 0.2s ease;
        }


        .back-link:hover {
            color: #2563eb;
        }


        /* =========================
           THEME BUTTON
        ========================= */

        .theme-toggle {

            width: 42px;
            height: 42px;

            border: 1px solid #cbd5e1;

            border-radius: 50%;

            background: #ffffff;

            color: #0f172a;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 19px;

            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                transform 0.2s ease,
                color 0.3s ease;
        }


        .theme-toggle:hover {

            transform: scale(1.08);

            border-color: #2563eb;
        }


        /* =========================
           LOGO
        ========================= */

        .logo-wrapper {

            display: flex;

            justify-content: center;

            margin-bottom: 24px;
        }


        .logo {

            display: flex;

            align-items: center;

            gap: 10px;

            text-decoration: none;

            color: #0f172a;

            font-size: 25px;

            font-weight: 800;

            letter-spacing: -1px;
        }


        .logo-icon {

            width: 42px;
            height: 42px;

            display: block;
        }


        .logo span {
            color: #2563eb;
        }


        /* =========================
           TITLE
        ========================= */

        .auth-title {

            text-align: center;

            font-size: 32px;

            line-height: 1.1;

            letter-spacing: -1px;

            margin-bottom: 9px;
        }


        .auth-subtitle {

            text-align: center;

            color: #64748b;

            font-size: 15px;

            margin-bottom: 30px;
        }


        /* =========================
           TABS
        ========================= */

        .tabs {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 5px;

            padding: 5px;

            background: #f1f5f9;

            border-radius: 12px;

            margin-bottom: 25px;
        }


        .tab {

            border: none;

            background: transparent;

            padding: 11px;

            border-radius: 8px;

            font-family: inherit;

            font-size: 14px;

            font-weight: 700;

            color: #64748b;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }


        .tab.active {

            background: #ffffff;

            color: #0f172a;

            box-shadow:
                0 2px 8px rgba(15, 23, 42, 0.08);
        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 17px;
        }


        .form-group label {

            display: block;

            font-size: 14px;

            font-weight: 700;

            margin-bottom: 7px;
        }


        .form-group input {

            width: 100%;

            height: 50px;

            padding: 0 14px;

            border: 1px solid #cbd5e1;

            border-radius: 11px;

            background: #ffffff;

            color: #0f172a;

            font-family: inherit;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.3s ease,
                color 0.3s ease;
        }


        .form-group input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 4px rgba(37, 99, 235, 0.12);
        }


        .form-group input::placeholder {
            color: #94a3b8;
        }


        /* =========================
           SUBMIT
        ========================= */

        .submit-button {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 11px;

            background: #2563eb;

            color: white;

            font-family: inherit;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .submit-button:hover {

            background: #1d4ed8;

            transform: translateY(-1px);
        }


        .submit-button:disabled {

            opacity: 0.65;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {

            display: none;

            margin-bottom: 18px;

            padding: 12px 14px;

            border-radius: 10px;

            font-size: 14px;

            line-height: 1.45;
        }


        .message.show {
            display: block;
        }


        .message.success {

            background: #dcfce7;

            color: #166534;

            border: 1px solid #bbf7d0;
        }


        .message.error {

            background: #fee2e2;

            color: #991b1b;

            border: 1px solid #fecaca;
        }


        /* =========================
           FOOTER
        ========================= */

        .auth-footer {

            text-align: center;

            margin-top: 24px;

            color: #64748b;

            font-size: 13px;
        }


        .auth-footer a {

            color: #2563eb;

            font-weight: 700;

            text-decoration: none;
        }


        .auth-footer a:hover {
            text-decoration: underline;
        }


        /* =========================
           REGISTER ONLY
        ========================= */

        #nameGroup {
            display: none;
        }


        /* =========================
           DARK MODE
        ========================= */

        body.dark {

            background: #0f172a;

            color: #f8fafc;
        }


        body.dark .page {

            background:
                radial-gradient(
                    circle at top right,
                    #1e3a8a,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    #312e81,
                    transparent 30%
                ),
                #0f172a;
        }


        body.dark .auth-card {

            background: rgba(15, 23, 42, 0.96);

            border-color: #334155;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35);
        }


        body.dark .back-link {
            color: #94a3b8;
        }


        body.dark .back-link:hover {
            color: #93c5fd;
        }


        body.dark .theme-toggle {

            background: #1e293b;

            border-color: #475569;

            color: #ffffff;
        }


        body.dark .logo {
            color: #f8fafc;
        }


        body.dark .auth-subtitle {
            color: #94a3b8;
        }


        body.dark .tabs {
            background: #1e293b;
        }


        body.dark .tab {
            color: #94a3b8;
        }


        body.dark .tab.active {

            background: #334155;

            color: #f8fafc;
        }


        body.dark .form-group input {

            background: #1e293b;

            border-color: #475569;

            color: #f8fafc;
        }


        body.dark .form-group input:focus {

            border-color: #60a5fa;

            box-shadow:
                0 0 0 4px rgba(96, 165, 250, 0.12);
        }


        body.dark .auth-footer {
            color: #94a3b8;
        }


        body.dark .message.success {

            background: #052e16;

            color: #bbf7d0;

            border-color: #166534;
        }


        body.dark .message.error {

            background: #450a0a;

            color: #fecaca;

            border-color: #991b1b;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 520px) {

            body {
                padding: 15px;
            }

            .auth-card {
                padding: 28px 22px;
                border-radius: 20px;
            }

            .auth-title {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>

<div class="page">

    <main class="auth-card">


        <!-- TOP BAR -->

        <div class="top-bar">

            <a
                href="index.html"
                class="back-link">

                ← Back to PrepComeBack

            </a>


            <button
                type="button"
                class="theme-toggle"
                id="themeToggle"
                aria-label="Switch to dark mode"
                title="Switch to dark mode">

                🌙

            </button>

        </div>


        <!-- LOGO -->

        <div class="logo-wrapper">

            <a
                href="index.html"
                class="logo">


                <!-- SVG LOGO -->

                <svg
                    class="logo-icon"
                    viewBox="0 0 100 100"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-label="PrepComeBack logo">

                    <rect
                        x="7"
                        y="7"
                        width="86"
                        height="86"
                        rx="24"
                        fill="#2563eb"/>

                    <path
                        d="M28 54
                           C28 38 39 28 53 28
                           C64 28 73 34 78 43"
                        fill="none"
                        stroke="white"
                        stroke-width="8"
                        stroke-linecap="round"/>

                    <path
                        d="M72 32
                           L79 43
                           L67 46"
                        fill="none"
                        stroke="white"
                        stroke-width="8"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>

                    <path
                        d="M72 47
                           C72 63 61 73 47 73
                           C36 73 27 67 22 58"
                        fill="none"
                        stroke="white"
                        stroke-width="8"
                        stroke-linecap="round"/>

                    <path
                        d="M28 69
                           L21 58
                           L33 55"
                        fill="none"
                        stroke="white"
                        stroke-width="8"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>

                </svg>


                <span>
                    Prep<span>ComeBack</span>
                </span>

            </a>

        </div>


        <!-- TITLE -->

        <h1
            class="auth-title"
            id="authTitle">

            Welcome back.

        </h1>


        <p
            class="auth-subtitle"
            id="authSubtitle">

            Sign in to continue your PrepComeBack journey.

        </p>


        <!-- TABS -->

        <div class="tabs">

            <button
                type="button"
                class="tab active"
                id="loginTab">

                Log In

            </button>


            <button
                type="button"
                class="tab"
                id="signupTab">

                Create Account

            </button>

        </div>


        <!-- MESSAGE -->

        <div
            class="message"
            id="message">
        </div>


        <!-- FORM -->

        <form id="authForm">


            <!-- NAME -->

            <div
                class="form-group"
                id="nameGroup">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Your name"
                    autocomplete="name">

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    minlength="6"
                    required>

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="submit-button"
                id="submitButton">

                Log In

            </button>


        </form>


        <!-- FOOTER -->

        <div class="auth-footer">

            By continuing, you agree to use PrepComeBack
            responsibly and respectfully.

            <br><br>

            <a href="index.html">
                ← Return to website
            </a>

        </div>


    </main>

</div>


<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    /* =========================
       SUPABASE CONFIG
    ========================= */

    const SUPABASE_URL =
        "https://bhoessvocspmuekgccll.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_SPzS34dfGQ-xJuvnAQU9gw_o0mJ-KcY";


    const { createClient } =
        supabase;


    const supabaseClient =
        createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );



    /* =========================
       THEME
    ========================= */

    const themeToggle =
        document.getElementById("themeToggle");


    function setTheme(theme) {

        if (theme === "dark") {

            document.body.classList.add("dark");

            themeToggle.textContent = "☀️";

            themeToggle.setAttribute(
                "aria-label",
                "Switch to light mode"
            );

            themeToggle.setAttribute(
                "title",
                "Switch to light mode"
            );

        } else {

            document.body.classList.remove("dark");

            themeToggle.textContent = "🌙";

            themeToggle.setAttribute(
                "aria-label",
                "Switch to dark mode"
            );

            themeToggle.setAttribute(
                "title",
                "Switch to dark mode"
            );

        }

        localStorage.setItem(
            "prepcomeback-theme",
            theme
        );

    }


    const savedTheme =
        localStorage.getItem(
            "prepcomeback-theme"
        );


    if (savedTheme === "dark") {

        setTheme("dark");

    } else {

        setTheme("light");

    }


    themeToggle.addEventListener(
        "click",
        function () {

            const isDark =
                document.body.classList.contains("dark");

            setTheme(
                isDark
                    ? "light"
                    : "dark"
            );

        }
    );



    /* =========================
       ELEMENTS
    ========================= */

    const loginTab =
        document.getElementById("loginTab");

    const signupTab =
        document.getElementById("signupTab");

    const nameGroup =
        document.getElementById("nameGroup");

    const nameInput =
        document.getElementById("name");

    const authTitle =
        document.getElementById("authTitle");

    const authSubtitle =
        document.getElementById("authSubtitle");

    const submitButton =
        document.getElementById("submitButton");

    const authForm =
        document.getElementById("authForm");

    const message =
        document.getElementById("message");


    let mode = "login";



    /* =========================
       MESSAGE
    ========================= */

    function showMessage(
        text,
        type
    ) {

        message.textContent = text;

        message.className =
            "message show " + type;

    }


    function hideMessage() {

        message.textContent = "";

        message.className =
            "message";

    }



    /* =========================
       LOGIN MODE
    ========================= */

    function showLogin() {

        mode = "login";

        loginTab.classList.add("active");

        signupTab.classList.remove("active");

        nameGroup.style.display = "none";

        nameInput.required = false;

        authTitle.textContent =
            "Welcome back.";

        authSubtitle.textContent =
            "Sign in to continue your PrepComeBack journey.";

        submitButton.textContent =
            "Log In";

        hideMessage();

    }



    /* =========================
       SIGNUP MODE
    ========================= */

    function showSignup() {

        mode = "signup";

        signupTab.classList.add("active");

        loginTab.classList.remove("active");

        nameGroup.style.display = "block";

        nameInput.required = true;

        authTitle.textContent =
            "Create your account.";

        authSubtitle.textContent =
            "Join the PrepComeBack global student community.";

        submitButton.textContent =
            "Create Account";

        hideMessage();

    }



    loginTab.addEventListener(
        "click",
        showLogin
    );


    signupTab.addEventListener(
        "click",
        showSignup
    );



    /* =========================
       AUTH FORM
    ========================= */

    authForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            hideMessage();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            submitButton.disabled = true;


            if (mode === "signup") {

                const name =
                    nameInput
                        .value
                        .trim();


                submitButton.textContent =
                    "Creating account...";


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {

                            data: {

                                full_name: name

                            },

                            emailRedirectTo:
                                window.location.origin +
                                "/login.html"

                        }

                    });


                if (error) {

                    showMessage(
                        error.message,
                        "error"
                    );

                    submitButton.disabled =
                        false;

                    submitButton.textContent =
                        "Create Account";

                    return;

                }


                showMessage(
                    "Account created! Please check your email and confirm your account before logging in.",
                    "success"
                );


                authForm.reset();

                submitButton.disabled =
                    false;

                submitButton.textContent =
                    "Create Account";


                return;

            }



            /* =========================
               LOGIN
            ========================= */

            submitButton.textContent =
                "Signing in...";


            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                showMessage(
                    error.message,
                    "error"
                );

                submitButton.disabled =
                    false;

                submitButton.textContent =
                    "Log In";

                return;

            }


            showMessage(
                "Login successful! Redirecting...",
                "success"
            );


            setTimeout(
                function () {

                    window.location.href =
                        "index.html";

                },
                700
            );

        }
    );



    /* =========================
       CHECK CURRENT SESSION
    ========================= */

    async function checkSession() {

        const {
            data
        } =
            await supabaseClient.auth.getSession();


        if (
            data &&
            data.session
        ) {

            // User is already logged in.

            console.log(
                "PrepComeBack user is logged in."
            );

        }

    }


    checkSession();

</script>

</body>

</html>
