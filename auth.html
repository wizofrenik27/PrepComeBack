
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PrepComeBack — Sign In</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        /* =====================================
           RESET
        ===================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================
           BODY
        ===================================== */

        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 0;

            background:
                radial-gradient(
                    circle at top right,
                    #dbeafe,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    #e0e7ff,
                    transparent 30%
                ),
                #f8fafc;

            color: #0f172a;

            transition:
                background 0.3s ease,
                color 0.3s ease;

        }


        /* =====================================
           CONTAINER
        ===================================== */

        .auth-container {

            width: min(430px, 92%);

        }


        /* =====================================
           LOGO
        ===================================== */

        .logo {

            text-align: center;

            font-size: 30px;

            font-weight: 800;

            letter-spacing: -1.5px;

            margin-bottom: 28px;

        }


        .logo span {

            color: #2563eb;

        }


        /* =====================================
           AUTH CARD
        ===================================== */

        .auth-card {

            background: #ffffff;

            border: 1px solid #e2e8f0;

            border-radius: 22px;

            padding: 32px;

            box-shadow:
                0 20px 60px
                rgba(15, 23, 42, 0.10);

            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;

        }


        .auth-card h1 {

            font-size: 30px;

            margin-bottom: 8px;

        }


        .subtitle {

            color: #64748b;

            margin-bottom: 25px;

            transition: color 0.3s ease;

        }


        /* =====================================
           TABS
        ===================================== */

        .tabs {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 8px;

            background: #f1f5f9;

            padding: 5px;

            border-radius: 11px;

            margin-bottom: 25px;

            transition: background 0.3s ease;

        }


        .tab {

            border: none;

            background: transparent;

            color: #0f172a;

            padding: 11px;

            border-radius: 8px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                box-shadow 0.3s ease;

        }


        .tab.active {

            background: #ffffff;

            box-shadow:
                0 2px 8px
                rgba(15, 23, 42, 0.08);

            color: #2563eb;

        }


        /* =====================================
           FORM
        ===================================== */

        .form-group {

            margin-bottom: 16px;

        }


        label {

            display: block;

            font-size: 14px;

            font-weight: 700;

            margin-bottom: 7px;

        }


        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            background: #ffffff;

            color: #0f172a;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;

        }


        input::placeholder {

            color: #94a3b8;

        }


        input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);

        }


        /* =====================================
           PASSWORD HINT
        ===================================== */

        .password-hint {

            font-size: 12px;

            color: #94a3b8;

            margin-top: 5px;

        }


        /* =====================================
           SUBMIT BUTTON
        ===================================== */

        .submit-btn {

            width: 100%;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            padding: 14px;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 8px;

            transition:
                background 0.2s ease,
                opacity 0.2s ease;

        }


        .submit-btn:hover {

            background: #1d4ed8;

        }


        .submit-btn:disabled {

            opacity: 0.65;

            cursor: not-allowed;

        }


        /* =====================================
           MESSAGE
        ===================================== */

        .message {

            display: none;

            margin-top: 16px;

            padding: 12px;

            border-radius: 10px;

            font-size: 14px;

            line-height: 1.5;

        }


        .message.show {

            display: block;

        }


        .message.error {

            background: #fee2e2;

            color: #991b1b;

        }


        .message.success {

            background: #dcfce7;

            color: #166534;

        }


        /* =====================================
           BACK HOME
        ===================================== */

        .back-home {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #64748b;

            font-size: 14px;

            transition: color 0.2s ease;

        }


        .back-home:hover {

            color: #2563eb;

        }


        /* =====================================
           DARK MODE
        ===================================== */

        body.dark {

            background:
                radial-gradient(
                    circle at top right,
                    #1e3a8a,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    #312e81,
                    transparent 30%
                ),
                #0f172a;

            color: #f8fafc;

        }


        body.dark .auth-card {

            background: #1e293b;

            border-color: #334155;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.30);

        }


        body.dark .subtitle {

            color: #94a3b8;

        }


        body.dark .tabs {

            background: #111827;

        }


        body.dark .tab {

            color: #cbd5e1;

        }


        body.dark .tab.active {

            background: #1e293b;

            color: #93c5fd;

        }


        body.dark input {

            background: #0f172a;

            color: #f8fafc;

            border-color: #475569;

        }


        body.dark input::placeholder {

            color: #64748b;

        }


        body.dark input:focus {

            border-color: #60a5fa;

        }


        body.dark .password-hint {

            color: #64748b;

        }


        body.dark .back-home {

            color: #94a3b8;

        }


        body.dark .back-home:hover {

            color: #93c5fd;

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 500px) {

            body {

                padding: 20px 0;

            }

            .auth-card {

                padding: 25px;

                border-radius: 18px;

            }

            .logo {

                font-size: 27px;

            }

            .auth-card h1 {

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


<div class="auth-container">


    <!-- =====================================
         LOGO
    ===================================== -->

    <div class="logo">

        Prep<span>ComeBack</span>

    </div>


    <!-- =====================================
         AUTH CARD
    ===================================== -->

    <div class="auth-card">


        <h1 id="authTitle">

            Create your account

        </h1>


        <p class="subtitle" id="authSubtitle">

            Join PrepComeBack and explore opportunities.

        </p>


        <!-- =====================================
             TABS
        ===================================== -->

        <div class="tabs">


            <button
                type="button"
                class="tab active"
                id="signupTab">

                Sign Up

            </button>


            <button
                type="button"
                class="tab"
                id="loginTab">

                Sign In

            </button>


        </div>


        <!-- =====================================
             FORM
        ===================================== -->

        <form id="authForm">


            <div class="form-group">

                <label for="email">

                    Email

                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required>

            </div>


            <div class="form-group">

                <label for="password">

                    Password

                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                    minlength="6"
                    autocomplete="current-password"
                    required>


                <div class="password-hint">

                    Minimum 6 characters

                </div>

            </div>


            <button
                type="submit"
                class="submit-btn"
                id="submitBtn">

                Create Account

            </button>


        </form>


        <!-- =====================================
             MESSAGE
        ===================================== -->

        <div
            class="message"
            id="message">
        </div>


    </div>


    <!-- =====================================
         BACK HOME
    ===================================== -->

    <a
        href="index.html"
        class="back-home">

        ← Back to PrepComeBack

    </a>


</div>


<script>


/* =====================================
   SUPABASE CONNECTION
===================================== */

const SUPABASE_URL =
    "https://bhoessvocspmuekgccll.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_SPzS34dfGQ-xJuvnAQU9gw_o0mJ-KcY";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================
   DARK MODE
   READ THE SAME THEME AS INDEX.HTML
===================================== */

const savedTheme =
    localStorage.getItem("prepcomeback-theme");


if (savedTheme === "dark") {

    document.body.classList.add("dark");

} else {

    document.body.classList.remove("dark");

}


/* =====================================
   ELEMENTS
===================================== */

const signupTab =
    document.getElementById("signupTab");


const loginTab =
    document.getElementById("loginTab");


const authForm =
    document.getElementById("authForm");


const authTitle =
    document.getElementById("authTitle");


const authSubtitle =
    document.getElementById("authSubtitle");


const submitBtn =
    document.getElementById("submitBtn");


const message =
    document.getElementById("message");


let mode = "signup";


/* =====================================
   MESSAGE
===================================== */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message show " + type;

}


/* =====================================
   SIGN UP TAB
===================================== */

signupTab.addEventListener(
    "click",
    function () {

        mode = "signup";

        signupTab.classList.add("active");

        loginTab.classList.remove("active");

        authTitle.textContent =
            "Create your account";

        authSubtitle.textContent =
            "Join PrepComeBack and explore opportunities.";

        submitBtn.textContent =
            "Create Account";

        message.className =
            "message";

    }
);


/* =====================================
   SIGN IN TAB
===================================== */

loginTab.addEventListener(
    "click",
    function () {

        mode = "login";

        loginTab.classList.add("active");

        signupTab.classList.remove("active");

        authTitle.textContent =
            "Welcome back";

        authSubtitle.textContent =
            "Sign in to continue to PrepComeBack.";

        submitBtn.textContent =
            "Sign In";

        message.className =
            "message";

    }
);


/* =====================================
   FORM SUBMIT
===================================== */

authForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const email =
            document.getElementById("email")
                .value
                .trim();


        const password =
            document.getElementById("password")
                .value;


        submitBtn.disabled = true;

        submitBtn.textContent =
            "Please wait...";


        /* =================================
           CREATE ACCOUNT
        ================================= */

        if (mode === "signup") {


            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password

                });


            if (error) {

                showMessage(
                    error.message,
                    "error"
                );

                submitBtn.disabled = false;

                submitBtn.textContent =
                    "Create Account";

                return;

            }


            showMessage(
                "Account created! Please check your email to confirm your account.",
                "success"
            );


            submitBtn.disabled = false;

            submitBtn.textContent =
                "Create Account";


            return;

        }


        /* =================================
           SIGN IN
        ================================= */

        const {
            data,
            error
        } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            showMessage(
                error.message,
                "error"
            );


            submitBtn.disabled = false;

            submitBtn.textContent =
                "Sign In";


            return;

        }


        /* =================================
           SUCCESS
        ================================= */

        window.location.href =
            "index.html";

    }
);


/* =====================================
   CHECK EXISTING SESSION
===================================== */

supabaseClient.auth.getSession()
    .then(function ({ data }) {

        if (data.session) {

            window.location.href =
                "index.html";

        }

    });


</script>


</body>

</html>
