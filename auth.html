<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PrepComeBack — Sign In</title>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at top right,
                    #dbeafe,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    #e0e7ff,
                    transparent 30%
                ),
                #f8fafc;

            color: #0f172a;

        }


        .auth-container {

            width: min(430px, 92%);

        }


        .logo {

            text-align: center;

            font-size: 30px;

            font-weight: 800;

            letter-spacing: -1.5px;

            margin-bottom: 28px;

        }


        .logo span {

            color: #2563eb;

        }


        .auth-card {

            background: white;

            border: 1px solid #e2e8f0;

            border-radius: 22px;

            padding: 32px;

            box-shadow:
                0 20px 60px
                rgba(15, 23, 42, 0.10);

        }


        .auth-card h1 {

            font-size: 30px;

            margin-bottom: 8px;

        }


        .subtitle {

            color: #64748b;

            margin-bottom: 25px;

        }


        .tabs {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 8px;

            background: #f1f5f9;

            padding: 5px;

            border-radius: 11px;

            margin-bottom: 25px;

        }


        .tab {

            border: none;

            background: transparent;

            padding: 11px;

            border-radius: 8px;

            font-weight: 700;

            cursor: pointer;

        }


        .tab.active {

            background: white;

            box-shadow:
                0 2px 8px
                rgba(15, 23, 42, 0.08);

            color: #2563eb;

        }


        .form-group {

            margin-bottom: 16px;

        }


        label {

            display: block;

            font-size: 14px;

            font-weight: 700;

            margin-bottom: 7px;

        }


        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);

        }


        .submit-btn {

            width: 100%;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            padding: 14px;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 8px;

        }


        .submit-btn:hover {

            background: #1d4ed8;

        }


        .message {

            display: none;

            margin-top: 16px;

            padding: 12px;

            border-radius: 10px;

            font-size: 14px;

            line-height: 1.5;

        }


        .message.show {

            display: block;

        }


        .message.error {

            background: #fee2e2;

            color: #991b1b;

        }


        .message.success {

            background: #dcfce7;

            color: #166534;

        }


        .back-home {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #64748b;

            font-size: 14px;

        }


        .back-home:hover {

            color: #2563eb;

        }


        .password-hint {

            font-size: 12px;

            color: #94a3b8;

            margin-top: 5px;

        }

    </style>

</head>


<body>


<div class="auth-container">


    <div class="logo">

        Prep<span>ComeBack</span>

    </div>


    <div class="auth-card">


        <h1 id="authTitle">

            Create your account

        </h1>


        <p class="subtitle" id="authSubtitle">

            Join PrepComeBack and explore opportunities.

        </p>


        <div class="tabs">


            <button
                type="button"
                class="tab active"
                id="signupTab">

                Sign Up

            </button>


            <button
                type="button"
                class="tab"
                id="loginTab">

                Sign In

            </button>


        </div>


        <form id="authForm">


            <div class="form-group">

                <label for="email">

                    Email

                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required>

            </div>


            <div class="form-group">

                <label for="password">

                    Password

                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                    minlength="6"
                    required>


                <div class="password-hint">

                    Minimum 6 characters

                </div>

            </div>


            <button
                type="submit"
                class="submit-btn"
                id="submitBtn">

                Create Account

            </button>


        </form>


        <div
            class="message"
            id="message">
        </div>


    </div>


    <a
        href="index.html"
        class="back-home">

        ← Back to PrepComeBack

    </a>


</div>


<script>


/* =====================================
   SUPABASE CONNECTION
===================================== */


const SUPABASE_URL =
    "https://bhoessvocspmuekgccll.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_SPzS34dfGQ-xJuvnAQU9gw_o0mJ-KcY";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =====================================
   ELEMENTS
===================================== */


const signupTab =
    document.getElementById("signupTab");


const loginTab =
    document.getElementById("loginTab");


const authForm =
    document.getElementById("authForm");


const authTitle =
    document.getElementById("authTitle");


const authSubtitle =
    document.getElementById("authSubtitle");


const submitBtn =
    document.getElementById("submitBtn");


const message =
    document.getElementById("message");


let mode = "signup";



/* =====================================
   MESSAGE
===================================== */


function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message show " + type;

}



/* =====================================
   SIGN UP
===================================== */


signupTab.addEventListener(
    "click",
    function () {

        mode = "signup";


        signupTab.classList.add("active");

        loginTab.classList.remove("active");


        authTitle.textContent =
            "Create your account";


        authSubtitle.textContent =
            "Join PrepComeBack and explore opportunities.";


        submitBtn.textContent =
            "Create Account";


        message.className =
            "message";

    }
);



/* =====================================
   SIGN IN
===================================== */


loginTab.addEventListener(
    "click",
    function () {

        mode = "login";


        loginTab.classList.add("active");

        signupTab.classList.remove("active");


        authTitle.textContent =
            "Welcome back";


        authSubtitle.textContent =
            "Sign in to continue to PrepComeBack.";


        submitBtn.textContent =
            "Sign In";


        message.className =
            "message";

    }
);



/* =====================================
   FORM
===================================== */


authForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const email =
            document.getElementById("email")
                .value
                .trim();


        const password =
            document.getElementById("password")
                .value;


        submitBtn.disabled = true;


        submitBtn.textContent =
            "Please wait...";



        /* ==============================
           CREATE ACCOUNT
        ============================== */


        if (mode === "signup") {


            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password

                });



            if (error) {

                showMessage(
                    error.message,
                    "error"
                );


                submitBtn.disabled = false;


                submitBtn.textContent =
                    "Create Account";


                return;

            }


            showMessage(
                "Account created! Please check your email to confirm your account.",
                "success"
            );


            submitBtn.disabled = false;


            submitBtn.textContent =
                "Create Account";


            return;

        }



        /* ==============================
           LOGIN
        ============================== */


        const {
            data,
            error
        } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });



        if (error) {

            showMessage(
                error.message,
                "error"
            );


            submitBtn.disabled = false;


            submitBtn.textContent =
                "Sign In";


            return;

        }



        /* ==============================
           SUCCESS
        ============================== */


        window.location.href =
            "index.html";

    }
);



/* =====================================
   CHECK EXISTING SESSION
===================================== */


supabaseClient.auth.getSession()
    .then(function ({ data }) {

        if (data.session) {

            window.location.href =
                "index.html";

        }

    });


</script>


</body>

</html>
